[project]
name = "project-kb"
version = "0.1.0"
description = "Local project knowledge layer for agent-assisted development"
readme = "README.md"
authors = [
    { name = "Vlad", email = "cuvka000@yandex.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2,<3",
    "typer>=0.26.8",
]

[project.scripts]
pkb = "project_kb.cli.app:main"
project-kb = "project_kb.cli.app:main"
pkb-mcp = "project_kb.transport.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
